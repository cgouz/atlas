basePath: /
definitions:
  dto.BatchResponse:
    properties:
      countries_total:
        type: integer
      country_ids:
        items:
          type: integer
        type: array
      created_at:
        type: string
      error_message:
        type: string
      finished_at:
        type: string
      id:
        type: integer
      runs:
        additionalProperties:
          format: int64
          type: integer
        description: Detail only (GET /v1/crawl-batches/{id}).
        type: object
      sites_pending:
        description: not started yet (or never, when cancelled)
        type: integer
      sites_skipped:
        type: integer
      sites_total:
        type: integer
      started_at:
        type: string
      status:
        type: string
    type: object
  dto.CategoryResponse:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      parent_id:
        type: integer
      subcategories:
        items:
          $ref: '#/definitions/dto.CategoryResponse'
        type: array
    type: object
  dto.CountryResponse:
    properties:
      id:
        type: integer
      is_active:
        type: boolean
      iso2:
        type: string
      iso3:
        type: string
      name:
        type: string
      region:
        type: string
      soato:
        type: string
      subregion:
        type: string
      translations:
        additionalProperties:
          type: string
        type: object
    type: object
  dto.CrawlRunResponse:
    properties:
      batch_id:
        type: integer
      created_at:
        type: string
      error_message:
        type: string
      finished_at:
        type: string
      id:
        type: integer
      pages_changed:
        type: integer
      pages_failed:
        type: integer
      pages_found:
        type: integer
      pages_new:
        type: integer
      pages_skipped:
        type: integer
      pages_unchanged:
        type: integer
      records_created:
        type: integer
      records_updated:
        type: integer
      site_id:
        type: integer
      started_at:
        type: string
      status:
        type: string
    type: object
  dto.CrawlingDataResponse:
    properties:
      category_id:
        type: integer
      confidence:
        type: number
      content:
        type: string
      content_hash:
        type: string
      country_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      language_code:
        type: string
      organization_id:
        type: integer
      page_id:
        type: integer
      published_at:
        type: string
      record_type:
        type: string
      site_id:
        type: integer
      source_url:
        type: string
      subcategory_id:
        type: integer
      summary:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.CrawlingDataSummary:
    properties:
      category_id:
        type: integer
      confidence:
        type: number
      country_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      language_code:
        type: string
      organization_id:
        type: integer
      page_id:
        type: integer
      published_at:
        type: string
      record_type:
        type: string
      site_id:
        type: integer
      source_url:
        type: string
      subcategory_id:
        type: integer
      summary:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.OrganizationResponse:
    properties:
      country_id:
        type: integer
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      official_name:
        type: string
      organization_type_id:
        type: integer
      parent_id:
        type: integer
      status:
        type: string
    type: object
  dto.OrganizationTypeResponse:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.PageResponse:
    properties:
      content_hash:
        type: string
      first_seen_at:
        type: string
      http_status:
        type: integer
      id:
        type: integer
      language_code:
        type: string
      last_crawled_at:
        type: string
      last_seen_at:
        type: string
      site_id:
        type: integer
      status:
        type: string
      url:
        type: string
    type: object
  dto.SiteResponse:
    properties:
      base_url:
        type: string
      country_id:
        type: integer
      crawl_interval_sec:
        type: integer
      domain:
        type: string
      id:
        type: integer
      is_official:
        type: boolean
      last_crawled_at:
        type: string
      last_error:
        type: string
      last_error_at:
        type: string
      last_success_at:
        type: string
      next_crawl_at:
        type: string
      organization_id:
        type: integer
      status:
        type: string
      verification_score:
        type: number
    type: object
  dto.StartBatchRequest:
    properties:
      country_ids:
        description: empty or missing = all active countries
        items:
          type: integer
        type: array
    type: object
  dto.UpdateCountryRequest:
    properties:
      is_active:
        description: only active countries are crawled
        example: true
        type: boolean
      name:
        description: English name, 1-150 characters
        example: Uzbekistan
        type: string
    type: object
  dto.UpdateOrganizationRequest:
    properties:
      description:
        description: free text; "" clears it
        example: Collects taxes and enforces tax law.
        type: string
      name:
        description: short name, 1-300 characters, unique within the country
        example: Tax Committee
        type: string
      official_name:
        description: full official name, up to 500 characters; "" clears it
        example: Tax Committee under the Ministry of Economy
        type: string
      status:
        description: active or inactive
        enum:
        - active
        - inactive
        example: active
        type: string
    type: object
  dto.UpdateSiteRequest:
    properties:
      base_url:
        description: where crawling starts; must be on the domain
        example: https://soliq.uz/
        type: string
      domain:
        description: host name only; the crawler stays on it and www.<domain>
        example: soliq.uz
        type: string
      status:
        description: inactive sites are never crawled
        enum:
        - active
        - inactive
        example: active
        type: string
    type: object
  infrastructure.ListResponse-dto_BatchResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.BatchResponse'
        type: array
      next_cursor:
        type: integer
    type: object
  infrastructure.ListResponse-dto_CategoryResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.CategoryResponse'
        type: array
      next_cursor:
        type: integer
    type: object
  infrastructure.ListResponse-dto_CountryResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.CountryResponse'
        type: array
      next_cursor:
        type: integer
    type: object
  infrastructure.ListResponse-dto_CrawlRunResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.CrawlRunResponse'
        type: array
      next_cursor:
        type: integer
    type: object
  infrastructure.ListResponse-dto_CrawlingDataSummary:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.CrawlingDataSummary'
        type: array
      next_cursor:
        type: integer
    type: object
  infrastructure.ListResponse-dto_OrganizationResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.OrganizationResponse'
        type: array
      next_cursor:
        type: integer
    type: object
  infrastructure.ListResponse-dto_OrganizationTypeResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.OrganizationTypeResponse'
        type: array
      next_cursor:
        type: integer
    type: object
  infrastructure.ListResponse-dto_PageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.PageResponse'
        type: array
      next_cursor:
        type: integer
    type: object
  infrastructure.ListResponse-dto_SiteResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.SiteResponse'
        type: array
      next_cursor:
        type: integer
    type: object
info:
  contact: {}
  description: |-
    Atlas crawls official government websites, turns every page into structured
    crawling data with an LLM (category, record type, title, summary, ...) and serves it here.

    Reference data (countries, organizations, categories, sites) is read-only and comes from
    the seed files. Crawls can be started for one site or as a batch over whole countries.

    List endpoints use cursor paging: pass the returned next_cursor as ?cursor= to get the
    next page; next_cursor is null on the last page.
  title: Atlas API
  version: "1.0"
paths:
  /health:
    get:
      description: Pings the database. Returns status ok and the configured LLM runtime,
        or 503 when the database is down.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok, llm_runtime: llamacpp|vllm'
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: 'status: down, database: the error'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /v1/categories:
    get:
      description: |-
        Returns the taxonomy the LLM classifies pages into. Categories have subcategories
        (parent_id). With ?tree=true top-level categories are returned with their subcategories nested.
        Not paginated.
      parameters:
      - description: Only subcategories of this category
        in: query
        name: parent_id
        type: integer
      - description: Only active (true) or inactive (false) categories
        in: query
        name: is_active
        type: boolean
      - description: Only top-level categories (no parent)
        in: query
        name: top_level
        type: boolean
      - description: Nest subcategories under their category (ignores parent_id and
          top_level)
        in: query
        name: tree
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infrastructure.ListResponse-dto_CategoryResponse'
        "400":
          description: Invalid query parameter
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List categories
      tags:
      - categories
  /v1/categories/{id}:
    get:
      parameters:
      - description: Category id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CategoryResponse'
        "400":
          description: id is not a positive integer
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Category not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a category
      tags:
      - categories
  /v1/countries:
    get:
      description: Returns countries ordered by id. With ?locale= the name is translated
        when a translation exists.
      parameters:
      - description: Only countries in this region, e.g. Asia
        in: query
        name: region
        type: string
      - description: Only active (true) or inactive (false) countries
        in: query
        name: is_active
        type: boolean
      - description: Translate names into this locale
        enum:
        - uz
        - ru
        - kaa
        in: query
        name: locale
        type: string
      - description: next_cursor from the previous page
        in: query
        name: cursor
        type: integer
      - description: Page size (default 300, max 1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infrastructure.ListResponse-dto_CountryResponse'
        "400":
          description: Invalid query parameter
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List countries
      tags:
      - countries
  /v1/countries/{id}:
    get:
      description: Returns one country; translations maps locale to the translated
        name.
      parameters:
      - description: Country id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CountryResponse'
        "400":
          description: id is not a positive integer
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Country not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a country
      tags:
      - countries
    patch:
      consumes:
      - application/json
      description: |-
        Changes the English name and/or is_active. Send only the fields to change.
        Deactivating a country stops new crawls of its sites (batches and the scheduler skip it);
        crawls already running finish normally.
      parameters:
      - description: Country id
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCountryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated country
          schema:
            $ref: '#/definitions/dto.CountryResponse'
        "400":
          description: Bad id, bad body, empty name, or nothing to update
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Country not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a country
      tags:
      - countries
  /v1/crawl-batches:
    get:
      description: Returns crawl batches newest first.
      parameters:
      - description: Only batches with this status, e.g. running
        in: query
        name: status
        type: string
      - description: next_cursor from the previous page
        in: query
        name: cursor
        type: integer
      - description: Page size (default 50, max 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infrastructure.ListResponse-dto_BatchResponse'
        "400":
          description: Invalid query parameter
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List crawl batches
      tags:
      - crawl-batches
    post:
      consumes:
      - application/json
      description: |-
        Crawls every active official site of the chosen countries in the background
        (all active countries when the body is empty or country_ids is empty).
        Only one batch runs at a time. Poll GET /v1/crawl-batches/{id} to follow it.
      parameters:
      - description: Countries to crawl (optional)
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.StartBatchRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Batch started
          schema:
            $ref: '#/definitions/dto.BatchResponse'
        "400":
          description: Invalid body, or no active sites in the selected countries
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Another batch is already running
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start a crawl batch
      tags:
      - crawl-batches
  /v1/crawl-batches/{id}:
    get:
      description: |-
        Returns one batch with progress: runs counts its crawl runs per status and
        sites_pending is how many sites have not started yet.
      parameters:
      - description: Crawl batch id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BatchResponse'
        "400":
          description: id is not a positive integer
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Crawl batch not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a crawl batch
      tags:
      - crawl-batches
  /v1/crawl-batches/{id}/cancel:
    post:
      description: 'Stops a running batch: sites not started yet are not crawled,
        running crawls are cancelled.'
      parameters:
      - description: Crawl batch id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Cancel requested
          schema:
            $ref: '#/definitions/dto.BatchResponse'
        "400":
          description: id is not a positive integer
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Crawl batch not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: The batch is not running anymore
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cancel a crawl batch
      tags:
      - crawl-batches
  /v1/crawl-runs:
    get:
      description: Returns crawl runs newest first. A run is one crawl of one site,
        with page and data counters.
      parameters:
      - description: Only runs of this site
        in: query
        name: site_id
        type: integer
      - description: Only runs started by this batch
        in: query
        name: batch_id
        type: integer
      - description: Only runs with this status
        enum:
        - running
        - completed
        - partial
        - failed
        - cancelled
        in: query
        name: status
        type: string
      - description: next_cursor from the previous page
        in: query
        name: cursor
        type: integer
      - description: Page size (default 50, max 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infrastructure.ListResponse-dto_CrawlRunResponse'
        "400":
          description: Invalid query parameter
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List crawl runs
      tags:
      - crawl-runs
  /v1/crawl-runs/{id}:
    get:
      description: Returns one crawl run. While status is running the counters keep
        growing.
      parameters:
      - description: Crawl run id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CrawlRunResponse'
        "400":
          description: id is not a positive integer
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Crawl run not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a crawl run
      tags:
      - crawl-runs
  /v1/crawling-data:
    get:
      description: |-
        Returns the normalized content the LLM produced from crawled pages, newest first.
        One item per page. The list leaves out the full content; get one item by id for it.
      parameters:
      - description: Only data of this country
        in: query
        name: country_id
        type: integer
      - description: Only data of this organization
        in: query
        name: organization_id
        type: integer
      - description: Only data of this site
        in: query
        name: site_id
        type: integer
      - description: Only data in this top-level category
        in: query
        name: category_id
        type: integer
      - description: Only data in this subcategory
        in: query
        name: subcategory_id
        type: integer
      - description: Only this record type, e.g. NEWS, LAW, DECREE (case-insensitive)
        in: query
        name: record_type
        type: string
      - description: Only this ISO 639-1 language, e.g. uz, ru, en
        in: query
        name: language
        type: string
      - description: Published on or after (YYYY-MM-DD or RFC 3339)
        in: query
        name: published_from
        type: string
      - description: Published before (YYYY-MM-DD or RFC 3339)
        in: query
        name: published_to
        type: string
      - description: next_cursor from the previous page
        in: query
        name: cursor
        type: integer
      - description: Page size (default 50, max 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infrastructure.ListResponse-dto_CrawlingDataSummary'
        "400":
          description: Invalid query parameter, or published_from is not before published_to
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List crawling data
      tags:
      - crawling-data
  /v1/crawling-data/{id}:
    get:
      description: Returns one item with the full cleaned content and the hash of
        the source text.
      parameters:
      - description: Crawling data id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CrawlingDataResponse'
        "400":
          description: id is not a positive integer
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Crawling data not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get crawling data
      tags:
      - crawling-data
  /v1/organization-types:
    get:
      description: Returns all organization types (ministry, agency, parliament, ...).
        Not paginated.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infrastructure.ListResponse-dto_OrganizationTypeResponse'
      summary: List organization types
      tags:
      - organization-types
  /v1/organizations:
    get:
      description: Returns government organizations (ministries, agencies, ...) ordered
        by id.
      parameters:
      - description: Only organizations of this country
        in: query
        name: country_id
        type: integer
      - description: Only organizations of this type
        in: query
        name: organization_type_id
        type: integer
      - description: Only child organizations of this parent
        in: query
        name: parent_id
        type: integer
      - description: Only organizations with this status, e.g. active
        in: query
        name: status
        type: string
      - description: next_cursor from the previous page
        in: query
        name: cursor
        type: integer
      - description: Page size (default 100, max 1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infrastructure.ListResponse-dto_OrganizationResponse'
        "400":
          description: Invalid query parameter
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List organizations
      tags:
      - organizations
  /v1/organizations/{id}:
    get:
      parameters:
      - description: Organization id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OrganizationResponse'
        "400":
          description: id is not a positive integer
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Organization not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get an organization
      tags:
      - organizations
    patch:
      consumes:
      - application/json
      description: |-
        Changes name, official_name, description and/or status. Send only the fields to change;
        an empty string clears official_name or description.
      parameters:
      - description: Organization id
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateOrganizationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated organization
          schema:
            $ref: '#/definitions/dto.OrganizationResponse'
        "400":
          description: Bad id, bad body, invalid value, or nothing to update
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Organization not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Another organization of the same country already has this name
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update an organization
      tags:
      - organizations
  /v1/pages:
    get:
      description: |-
        Returns every URL the crawler has seen, newest first. status tells what happened to
        the page on its last crawl (new, changed, unchanged, skipped, failed).
      parameters:
      - description: Only pages of this site
        in: query
        name: site_id
        type: integer
      - description: Only pages with this status
        in: query
        name: status
        type: string
      - description: next_cursor from the previous page (pages with a lower id follow)
        in: query
        name: cursor
        type: integer
      - description: Page size (default 100, max 1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infrastructure.ListResponse-dto_PageResponse'
        "400":
          description: Invalid query parameter
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List pages
      tags:
      - pages
  /v1/sites:
    get:
      description: Returns the websites Atlas crawls, with their crawl schedule and
        last result.
      parameters:
      - description: Only sites of this country
        in: query
        name: country_id
        type: integer
      - description: Only sites of this organization
        in: query
        name: organization_id
        type: integer
      - description: Only sites with this status, e.g. active
        in: query
        name: status
        type: string
      - description: next_cursor from the previous page
        in: query
        name: cursor
        type: integer
      - description: Page size (default 100, max 1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infrastructure.ListResponse-dto_SiteResponse'
        "400":
          description: Invalid query parameter
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List sites
      tags:
      - sites
  /v1/sites/{id}:
    get:
      parameters:
      - description: Site id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SiteResponse'
        "400":
          description: id is not a positive integer
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Site not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a site
      tags:
      - sites
    patch:
      consumes:
      - application/json
      description: |-
        Changes domain, base_url and/or status. Send only the fields to change.
        base_url must be on the domain (domain or www.domain); when changing the domain, send a
        matching base_url in the same request. status inactive stops new crawls of the site; a crawl
        already running finishes with the old settings. Crawl history and pages are kept.
      parameters:
      - description: Site id
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateSiteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated site
          schema:
            $ref: '#/definitions/dto.SiteResponse'
        "400":
          description: Bad id, bad body, invalid domain/base_url/status, or nothing
            to update
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Site not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Another site already has this domain
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a site
      tags:
      - sites
  /v1/sites/{id}/crawl:
    post:
      description: |-
        Starts a crawl of one site in the background and returns the new crawl run right away.
        Poll GET /v1/crawl-runs/{id} to follow its progress.
      parameters:
      - description: Site id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Crawl started
          schema:
            $ref: '#/definitions/dto.CrawlRunResponse'
        "400":
          description: id is not a positive integer
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Site not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: This site is already being crawled
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Too many crawls running; try again later
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Crawl a site now
      tags:
      - crawl-runs
swagger: "2.0"
